[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"pg_probackup2" = "src"

[tool.setuptools.dynamic]
version = {attr = "pg_probackup2.__version__"}

[tool.flake8]
extend-ignore = ["E501"]
exclude = [".git", "__pycache__", "env", "venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_file_level = "NOTSET"
log_file_format = "%(levelname)8s [%(asctime)s] %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[project]
name = "testgres_pg_probackup2"
dynamic = ["version"]
description = "Plugin for testgres that manages pg_probackup2"
readme = "README.md"
requires-python = ">=3.7.3"

# Формат для совместимости с Python 3.7
license = {text = "PostgreSQL"}

authors = [
    {name = "Postgres Professional", email = "testgres@postgrespro.ru"},
]

keywords = [
    "pg_probackup",
    "testing",
    "testgres",
]

classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Audience :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "lz4",
    "pefile",
    "testgres>=1.14.4,<1.18",
    "zstd",
]

[project.urls]
"HomePage" = "https://github.com/postgrespro/testgres-pg_probackup2"
