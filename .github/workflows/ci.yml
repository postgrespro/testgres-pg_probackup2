# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"

  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**/*.md"

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 flake8-pyproject ruff==0.15.22 validate-pyproject[all]
    - name: Lint with flake8
      run: |
        flake8 .
    - name: Lint with ruff
      run: |
        ruff check .
    - name: Check pyproject
      run: |
        validate-pyproject pyproject.toml

  build-check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package metadata
      run: |
        twine check dist/*

  test-linux-container:
    runs-on: ubuntu-latest
    needs: build-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "alpine"
            python: "3.7"
            postgres: "17"
            case_suffix: "py3_07_xx-pg17_xx"
          - platform: "alpine"
            python: "3.8.0"
            postgres: "17"
            case_suffix: "py3_08_00-pg17_xx"
          - platform: "alpine"
            python: "3.8"
            postgres: "17"
            case_suffix: "py3_08_xx-pg17_xx"
          - platform: "alpine"
            python: "3.9"
            postgres: "17"
            case_suffix: "py3_09_xx-pg17_xx"
          - platform: "alpine"
            python: "3.10"
            postgres: "17"
            case_suffix: "py3_10_xx-pg17_xx"
          - platform: "alpine"
            python: "3.11"
            postgres: "17"
            case_suffix: "py3_11_xx-pg17_xx"
          - platform: "alpine"
            python: "3.12"
            postgres: "17"
            case_suffix: "py3_12_xx-pg17_xx"
          - platform: "alpine"
            python: "3.13"
            postgres: "17"
            case_suffix: "py3_13_xx-pg17_xx"
          - platform: "alpine"
            python: "3.14"
            postgres: "17"
            case_suffix: "py3_14_xx-pg17_xx"
          - platform: "alpine"
            python: "3.12"
            postgres: "14"
            case_suffix: "py3_12_xx-pg14_xx"
          - platform: "alpine"
            python: "3.12"
            postgres: "15"
            case_suffix: "py3_12_xx-pg15_xx"
          - platform: "alpine"
            python: "3.12"
            postgres: "16"
            case_suffix: "py3_12_xx-pg16_xx"
#
#           11.06 /usr/lib/gcc/x86_64-alpine-linux-musl/15.2.0/../../../../x86_64-alpine-linux-musl/bin/ld: src/pg_crc.o: in function `crc32_bytea':
#           11.06 pg_crc.c:(.text+0x9): undefined reference to `pg_detoast_datum_packed'
#          - platform: "alpine"
#            python: "3.12"
#            postgres: "18"
#            case_suffix: "py3_12_xx-pg18_xx"

    name: "test: ${{ matrix.platform }} | ${{ matrix.case_suffix }}"

    env:
      BASE_SIGN: "${{ matrix.platform }}-${{ matrix.case_suffix }}"

    steps:
    - name: Prepare variables
      run: |
        echo "RUN_CFG__NOW=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
        echo "RUN_CFG__LOGS_DIR=logs-${{ env.BASE_SIGN }}" >> $GITHUB_ENV
        echo "RUN_CFG__DOCKER_IMAGE_NAME=tests-${{ env.BASE_SIGN }}" >> $GITHUB_ENV
        echo "---------- [$GITHUB_ENV]"
        cat $GITHUB_ENV
    - name: Checkout
      uses: actions/checkout@v7
    - name: Prepare logs folder on the host
      run: mkdir -p "${{ env.RUN_CFG__LOGS_DIR }}"
    - name: Adjust logs folder permission
      run: chmod -R 777 "${{ env.RUN_CFG__LOGS_DIR }}"
    - name: Build local image ${{ matrix.alpine }}
      run: docker build --build-arg PG_VERSION="${{ matrix.postgres }}" --build-arg PYTHON_VERSION="${{ matrix.python }}" -t "${{ env.RUN_CFG__DOCKER_IMAGE_NAME }}" -f Dockerfile--${{ matrix.platform }}.tmpl .
    - name: Run
      run: docker run -t -v ${{ github.workspace }}/${{ env.RUN_CFG__LOGS_DIR }}:/home/test/work/logs "${{ env.RUN_CFG__DOCKER_IMAGE_NAME }}"
    - name: Upload Logs
      uses: actions/upload-artifact@v7
      if: always() # IT IS IMPORTANT!
      with:
        name: testgres.pbk2--test_logs--${{ env.RUN_CFG__NOW }}-${{ env.BASE_SIGN }}-id${{ github.run_id }}
        path: "${{ env.RUN_CFG__LOGS_DIR }}/"
